name: Check public repository privacy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the privacy checker
        run: python3 -B -m unittest discover -s tests -p test_public_tree.py -v
      - name: Check the public tree
        run: python3 tools/check_public_tree.py
      - name: Install Gitleaks 8.30.1
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          cd "$RUNNER_TEMP"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check
          tar --extract --gzip --file "$archive" gitleaks
      - name: Scan files and Git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact .
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts='--all' .
