interface=wlan0
except-interface=lo
listen-address=192.168.4.1
bind-interfaces
no-resolv
no-hosts
address=/#/192.168.4.1
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,10m
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1
dhcp-authoritative
leasefile-ro
log-facility=/dev/null
user=dnsmasq
group=nogroup
